<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>世纪广场 · .cp-marble 三档检视（2026-11-22 接线后）</title>
<link rel="stylesheet" href="../assets/themes/century-sq.css">
<style>
  html,body{margin:0;padding:28px 30px;background:#fff;color:#2b2b2b;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  h1{font-size:16px;margin:0 0 4px;font-weight:600;letter-spacing:.04em}
  .sub{font-size:11.5px;color:#8a8a8a;margin:0 0 18px}
  .row{display:flex;gap:18px;align-items:flex-start}
  .panel{width:372px;height:250px;border-radius:6px;overflow:hidden;
    border:1px solid #e3e6ea}
  .cap{font-size:11.5px;color:#666;margin:7px 2px 0}
  .wide{width:1180px;height:320px;margin-top:24px;border-radius:6px;overflow:hidden;
    border:1px solid #e3e6ea}
  .wide .txt{position:relative;z-index:2;padding:54px 64px;max-width:760px}
  .wide h2{font-size:40px;margin:0 0 14px;letter-spacing:-.01em;color:#1b1b1b}
  .wide p{font-size:15px;line-height:1.85;margin:0;color:#3a3a3a}
</style>
</head>
<body>
<h1>世纪广场 · <code>.cp-marble</code> 接线后三档</h1>
<p class="sub">位图层已进主题 CSS（默认 <code>opacity:.85</code>）；<code>--flat</code> 退回纯 CSS，<code>--soft</code> 为 0.62 轻量档。颜色始终取 <code>--marble</code>。</p>

<div class="row">
  <div>
    <div class="panel cp-marble cp-marble--flat"></div>
    <div class="cap">A · <code>--flat</code> 纯 CSS（回退态）</div>
  </div>
  <div>
    <div class="panel cp-marble"></div>
    <div class="cap">B · 默认（位图 × multiply 0.85）</div>
  </div>
  <div>
    <div class="panel cp-marble cp-marble--soft"></div>
    <div class="cap">C · <code>--soft</code>（0.62）</div>
  </div>
</div>

<div class="wide cp-marble">
  <div class="txt">
    <h2>世纪广场 · 一层平面</h2>
    <p>模度控制下的清水混凝土与光面大理石，接缝以 1.5 米的模数分格；天光从北侧高窗灌入，把石材的层理压到极低的对比里。正文压在纹理上仍然清楚。</p>
  </div>
</div>
</body>
</html>
