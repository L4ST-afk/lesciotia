<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <rect width="1600" height="600" fill="#fbf7ea"/>
  <g stroke="#1a7fb8" stroke-width="3" opacity=".55">
    <!-- 竖线：折射会在棱带里把它们弯成弧 -->
    <g>
      <line x1="80" y1="0" x2="80" y2="600"/><line x1="160" y1="0" x2="160" y2="600"/>
      <line x1="240" y1="0" x2="240" y2="600"/><line x1="320" y1="0" x2="320" y2="600"/>
      <line x1="400" y1="0" x2="400" y2="600"/><line x1="480" y1="0" x2="480" y2="600"/>
      <line x1="560" y1="0" x2="560" y2="600"/><line x1="640" y1="0" x2="640" y2="600"/>
      <line x1="720" y1="0" x2="720" y2="600"/><line x1="800" y1="0" x2="800" y2="600"/>
      <line x1="880" y1="0" x2="880" y2="600"/><line x1="960" y1="0" x2="960" y2="600"/>
      <line x1="1040" y1="0" x2="1040" y2="600"/><line x1="1120" y1="0" x2="1120" y2="600"/>
      <line x1="1200" y1="0" x2="1200" y2="600"/><line x1="1280" y1="0" x2="1280" y2="600"/>
      <line x1="1360" y1="0" x2="1360" y2="600"/><line x1="1440" y1="0" x2="1440" y2="600"/>
      <line x1="1520" y1="0" x2="1520" y2="600"/>
    </g>
    <!-- 横线 -->
    <g stroke="#84318e">
      <line x1="0" y1="100" x2="1600" y2="100"/><line x1="0" y1="200" x2="1600" y2="200"/>
      <line x1="0" y1="300" x2="1600" y2="300"/><line x1="0" y1="400" x2="1600" y2="400"/>
      <line x1="0" y1="500" x2="1600" y2="500"/>
    </g>
  </g>
  <text x="800" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="84"
        fill="#1a1410" letter-spacing="2">LENS · 折射测试图</text>
</svg>
